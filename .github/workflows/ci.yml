name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake
      - run: bundle exec rubocop
      - run: bundle exec rake build
      - name: Install and load the packaged gem
        run: |
          export CHECKIFY_VERSION="$(ruby -Ilib -rcheckify/version -e 'print Checkify::VERSION')"
          gem install pkg/checkify-*.gem --no-document
          cd "$(mktemp -d)"
          ruby -rcheckify -e 'abort unless Checkify::VERSION == ENV.fetch("CHECKIFY_VERSION"); Checkify::Client.new(api_key: "test-key")'
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan Git history for credentials
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0 git /repo --config /repo/.gitleaks.toml --log-opts='--all' --redact --no-banner
