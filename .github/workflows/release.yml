name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Check release tag matches gem version
        run: ruby -Ilib -rcheckify/version -e 'abort "Tag does not match gem version" unless ENV.fetch("GITHUB_REF_NAME") == "v#{Checkify::VERSION}"'
      - uses: rubygems/release-gem@v1
